<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>木虱鱼 · 联机版</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root{
  --gold:#d9b45c; --gold-hi:#f2ce78; --gold-dim:#9a7c34;
  --felt:#0d3b2a; --felt-dark:#04150f;
  --panel:rgba(8,20,16,.82); --line:rgba(217,180,92,.4);
  --green-hi:#9fe6bf; --btn-draw:#F4C447;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 40%,#0d5c3e,#073826 60%,#04241a);
  color:#fff;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#app{position:relative;margin:0 auto;height:100dvh;max-width:430px;width:100%;
  display:flex;flex-direction:column;background:#0a0a0c;overflow:hidden}
#statusbar{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:#000;font-size:11px;font-weight:600;color:#fff;z-index:6}
#topbar{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:linear-gradient(180deg,#15130c,#0a0906);border-bottom:1px solid var(--gold-dim);z-index:6}
#topbar .back{font-size:20px;color:var(--gold);width:22px;text-align:center}
#room{line-height:1.25;min-width:0}
#room b{font-size:13px;font-weight:700;white-space:nowrap}
#room small{display:block;font-size:10px;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .sp{flex:1}
.icobtn{width:28px;height:28px;border:none;background:transparent;color:var(--gold);font-size:15px;cursor:pointer}
#conn{font-size:9px;padding:1px 6px;border-radius:8px;background:#333;color:#aaa}
#conn.ok{background:#1a5c2a;color:#7de3a8}

#table{flex:1;position:relative;min-height:0;overflow:hidden;
  background:url(assets/table-v.jpg) center/cover no-repeat, #04150f}
#table:before{content:"";position:absolute;inset:0;background:rgba(4,16,10,.22)}
#arena{position:absolute;inset:0}
.seat{position:absolute;display:flex;align-items:center;gap:5px;transform:translate(-50%,-50%);z-index:3}
.seat.v{flex-direction:column;gap:0;text-align:center;transform:translateX(-50%)}
.seat .avwrap{position:relative;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;background-size:cover;background-position:center}
.seat.h .avatar{width:36px;height:36px}
.seat.act .avwrap:after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2px solid #e5544b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bankerbadge{position:absolute;left:-6px;bottom:-2px;width:20px;height:20px;
  background:url(assets/banker-badge.png) center/cover}
.seatinfo{display:flex;flex-direction:column;gap:1px;min-width:0}
.seat.v .seatinfo{align-items:center}
.sname{font-size:10px;font-weight:600;color:rgba(255,255,255,.94);white-space:nowrap}
.schips{font-size:9.5px;color:#ffd97a;display:flex;align-items:center;gap:3px;white-space:nowrap}
.chip-ic{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e86a5e,#a01d16);border:1px dashed #ffd0a0;flex:none}
.cardsrow{display:flex;margin-top:2px}
.seat.h .cardsrow{margin-top:0}
.mcard{width:21px;height:30px;border-radius:3px;margin:0 -2px;
  background:url(assets/card-back.png) center/cover;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.seat.folded .cardsrow,.seat.folded .seatinfo{opacity:.35}
.sebring{position:absolute;inset:-9px;pointer-events:none}
.sebring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sebring .bgc{stroke:rgba(255,255,255,.14)}
.sebring .fgc{stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s linear}
.sebring .ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000}
.face-up{display:flex;gap:2px}
.face-up .fc{width:26px;height:37px;border-radius:3px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1.5px rgba(217,180,92,.75),0 2px 6px rgba(0,0,0,.55)}
.face-up .fc img{width:100%;height:100%;display:block}
.face-up .fc.pop{animation:pop .3s ease-out}
.bright{animation:brightPulse 1.1s ease-in-out infinite alternate}
@keyframes brightPulse{from{box-shadow:0 0 0 1.5px rgba(217,180,92,.5),0 0 6px rgba(242,206,120,.35)}
to{box-shadow:0 0 0 2px rgba(242,206,120,.95),0 0 16px rgba(242,206,120,.8)}}
.flycard{position:absolute;width:26px;height:37px;border-radius:4px;z-index:14;
  background:url(assets/card-back.png) center/cover;box-shadow:0 3px 10px rgba(0,0,0,.6);
  transition:transform .34s cubic-bezier(.45,.1,.55,1)}
.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#pot{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;
  font-size:11px;color:#ffd97a;background:rgba(0,0,0,.5);padding:3px 12px;border-radius:10px;white-space:nowrap}
#banner{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:3;
  padding:8px 18px;border-radius:10px;white-space:nowrap;text-align:center;
  background:linear-gradient(180deg,#1b2b22,#0c1a12);
  border:1.5px solid var(--gold);box-shadow:0 0 0 1px #0006,0 4px 14px #0009}
#banner b{color:var(--gold-hi);font-size:12.5px;letter-spacing:1px}
#specbtn{position:absolute;right:8px;top:12px;z-index:4;font-size:10px;color:#ffd97a;
  background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:3px 8px;cursor:pointer}
#speclist{position:absolute;right:8px;top:38px;z-index:8;font-size:10px;color:#eee;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#speclist.show{display:block}
#mezone{flex:none;position:relative;z-index:5;padding:6px 14px 10px;
  background:linear-gradient(180deg,rgba(4,30,20,.18),rgba(3,14,9,.62) 55%);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border-top:1px solid rgba(217,180,92,.28)}
#meline{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#meavatar{width:42px;height:42px;border-radius:50%;flex:none;position:relative;
  border:2px solid var(--gold);background-size:cover;background-position:center}
#meavatar .bankerbadge{left:auto;right:-6px}
#meinfo b{font-size:13px;font-weight:600;white-space:nowrap}
#mechips{font-size:12px;color:#ffd97a;display:flex;align-items:center;gap:4px}
#handinfo{margin-left:auto;text-align:right;white-space:nowrap}
#handinfo .t1{font-size:12px;color:var(--green-hi)}
#handinfo .t1 b{color:#fff;font-size:15px}
#handinfo .t2{font-size:11px;color:#ffd97a}
#hand{display:flex;justify-content:center;align-items:center;gap:10px;min-height:116px;margin-bottom:8px}
.pcard{width:80px;height:114px;border-radius:8px;background:#fff;position:relative;
  box-shadow:0 4px 10px rgba(0,0,0,.5),0 0 0 1.5px rgba(217,180,92,.55);flex:none;overflow:hidden}
.pcard img{width:100%;height:100%;display:block}
.pcard.pop{animation:pop .3s ease-out}
#drawslot{width:80px;height:114px;border-radius:8px;border:1.5px dashed rgba(255,255,255,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:rgba(255,255,255,.6);font-size:11px;flex:none;cursor:pointer}
#actions{display:flex;gap:10px}
.abtn{flex:1;height:48px;border-radius:16px;border:none;cursor:pointer;
  background-size:cover;background-position:center;position:relative}
.abtn:disabled{opacity:.4;cursor:default}
.abtn:not(:disabled):active{transform:translateY(1px)}
#btn-stop{background-image:url(assets/btn-pass.png)}
#btn-draw{background-image:url(assets/btn-draw.png)}
.abtn-tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#3d2c05;letter-spacing:1px;pointer-events:none}
#btn-draw.raise{background-image:none!important;background:linear-gradient(180deg,#f7d67a,var(--btn-draw));
  box-shadow:0 0 0 2px rgba(242,206,120,.55),0 4px 12px rgba(201,161,62,.4)}
#btn-draw.raise .abtn-tx{color:#3d2c05;font-size:15px;white-space:nowrap}
#btn-draw.raise.raised{background:linear-gradient(180deg,#ffe9a8,#f2ce78);
  box-shadow:0 0 0 2px rgba(255,240,190,.8),0 4px 14px rgba(242,206,120,.5)}
.ringwrap{position:relative;width:52px;height:52px;flex:none;display:none}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringwrap .bgc{stroke:rgba(255,255,255,.12)}
.ringwrap .fgc{stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s linear}
.ringwrap .mid{position:absolute;inset:5px;border-radius:50%;background-size:cover;background-position:center}
.ringwrap .ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--gold-hi);text-shadow:0 1px 4px #000}
.ringwrap.urgent .ringtxt{animation:urgentBlink .6s infinite alternate}
@keyframes urgentBlink{from{opacity:.55}to{opacity:1;transform:scale(1.15)}}
#home2{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:#000}
#home2 i{width:110px;height:5px;border-radius:3px;background:#3a3a3e}
#overlay{position:absolute;inset:0;background:rgba(2,8,5,.74);z-index:20;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#overlay.show{display:flex}
.panel{width:88%;max-width:330px;background:linear-gradient(180deg,#12241b,#0a1712);
  border:1.5px solid var(--gold);border-radius:16px;padding:16px;max-height:82%;overflow:auto}
.panel h3{color:var(--gold-hi);font-size:15px;margin-bottom:10px;text-align:center}
.panel .ok{margin-top:14px;width:100%;height:44px;border-radius:14px;border:none;
  background:linear-gradient(180deg,#f7d67a,var(--btn-draw));color:#3d2c05;font-weight:800;font-size:15px;cursor:pointer}
.srow{display:flex;justify-content:space-between;font-size:12px;padding:5px 2px;
  border-bottom:1px dashed rgba(255,255,255,.12)}
.stotal{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-top:10px}
#reconnect{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.85);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:12px}
#reconnect.show{display:flex}
#reconnect .msg{font-size:15px;color:#fff}
#reconnect .sub{font-size:11px;color:#999}
.floaty{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:16;
  font-size:30px;font-weight:900;pointer-events:none;animation:floaty 1.6s ease-out forwards;text-shadow:0 2px 10px #000}
.floaty.plus{color:#7de3a8}.floaty.minus{color:#ff8f86}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scale(1.15)}}
</style>
</head>
<body>
<div id="app">
  <div id="statusbar"><span>9:41</span><span>木虱鱼</span><span>▂▄▆</span></div>
  <div id="topbar">
    <span class="back">‹</span>
    <div id="room"><b>木虱鱼 · 闸坡厅</b><small id="roominfo"></small></div>
    <span class="sp"></span>
    <span id="conn">连接中…</span>
    <button class="icobtn">🔊</button>
  </div>
  <div id="table">
    <div id="arena"></div>
    <div id="pot">池底 0</div>
    <div id="banner"><b>连接中…</b></div>
    <button id="specbtn">围观 ×0</button>
    <div id="speclist"></div>
    <div id="flylayer" style="position:absolute;inset:0;pointer-events:none;z-index:14"></div>
  </div>
  <div id="mezone">
    <div id="meline">
      <div id="meavatar"><span id="mebanker"></span><span id="myraise" class="raisehand" style="display:none">✋</span></div>
      <div id="meinfo">
        <b id="myname">—</b>
        <div id="mechips"><span class="chip-ic"></span><span id="mychips">0</span></div>
      </div>
      <div id="handinfo"><div class="t1">—</div><div class="t2"></div></div>
    </div>
    <div id="hand"><div id="drawslot" style="display:none"><span style="font-size:20px">+</span>补牌位</div></div>
    <div id="actions">
      <button class="abtn" id="btn-stop" aria-label="过" disabled></button>
      <button class="abtn" id="btn-draw" aria-label="补一张" disabled></button>
    </div>
  </div>
  <div id="home2"><i></i></div>
  <div id="reconnect"><div class="msg">与服务器断开</div><div class="sub">正在重连…</div></div>
  <div id="overlay"><div class="panel" id="panelbox"></div></div>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
"use strict";
/* 木虱鱼 · 联机版客户端
   数据来源: socket.io 服务端(权威)
   渲染: 同单机版 CSS/动画 */

const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("en-US");
const SUIT_L={"♠":"S","♥":"H","♣":"C","♦":"D"};
const RANK_STR={1:"A",11:"J",12:"Q",13:"K"};
const rankStr=r=>RANK_STR[r]||String(r);
function cardFaceSrc(c){
  if(c.hidden) return null;
  if(c.joker) return "assets/cards/"+(c.red?"J-1":"J-2")+".png";
  return "assets/cards/"+(SUIT_L[c.suit]||c.suit)+"-"+rankStr(c.rank)+".png";
}
const RING_C=2*Math.PI*24;
function ringColor(frac){
  const stops=[[0,"#e5544b"],[0.5,"#f2ce78"],[1,"#3ddc84"]];
  const f=Math.max(0,Math.min(1,frac));
  for(let i=0;i<stops.length-1;i++){
    const [f0,c0]=stops[i],[f1,c1]=stops[i+1];
    if(f>=f0&&f<=f1){
      const t=(f-f0)/(f1-f0||1);
      const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
      const a=hx(c0),b=hx(c1);
      const mix=a.map((v,k)=>Math.round(v+(b[k]-v)*t));
      return `rgb(${mix[0]},${mix[1]},${mix[2]})`;
    }
  }
  return "#3ddc84";
}
const SEAT_ANGLES={1:[90],2:[150,30],3:[160,90,20],4:[170,115,65,10],5:[175,135,90,45,5],
  6:[188,145,110,70,35,352],7:[90,160,20,190,350,218,322],
  8:[139,90,41,175,5,195,345,222],9:[139,90,41,175,5,195,345,222,270],
  10:[150,90,30,172,8,188,352,205,335,250],
  11:[139,90,41,163,17,197,343,222,142,270,38]};
const RX=40, RY=42, CX=50, CY=47;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- 状态 ---- */
const S={roomId:null,myPid:null,players:[],phase:"idle",round:0,pot:0,ante:200,
  raised:new Set(),bankerSeq:0,myCards:[],handType:null,handMult:0,
  ringOwner:null,ringDeadline:0,ringTotal:0};

/* ---- 渲染(同单机版) ---- */
function seatEl(id){ return document.querySelector(`.seat[data-pid="${id}"]`); }
function renderSeats(){
  const arena=$("#arena"); arena.innerHTML="";
  const opps=S.players.filter(p=>p.pid!==S.myPid);
  const me=S.players.find(p=>p.pid===S.myPid);
  const all=[...opps, ...(me?[me]:[])];
  const angles=SEAT_ANGLES[opps.length];
  if(!angles){ arena.innerHTML=""; return; }
  // 对手按角度排, 我固定底部
  opps.forEach((p,i)=>{
    const a=angles[i]*Math.PI/180;
    const x=CX+RX*Math.cos(a), y=CY-RY*Math.sin(a);
    const vertical=Math.abs(angles[i]-90)<=45;
    const hl=angles[i]>90;
    const el=document.createElement("div");
    el.className="seat "+(vertical?"v":"h"+(hl?" l":" r"))+(p.inTurn?" act":"")+(p.folded?" folded":"");
    el.dataset.pid=p.pid;
    el.style.left=x+"%"; el.style.top=y+"%";
    const backs=p.cards&&p.cards.length?p.cards.map(()=>'<div class="mcard"></div>').join(""):"";
    const faces=p.revealed?p.cards.map(c=>`<span class="fc"><img src="${cardFaceSrc(c)}"></span>`).join(""):"";
    el.innerHTML=`
      <div class="avwrap"><div class="avatar" style="background-image:url('${p.face||''}')"></div>
        ${p.banker?'<div class="bankerbadge"></div>':""}</div>
      <div class="seatinfo">
        <span class="sname">${p.name}</span>
        <span class="schips"><span class="chip-ic"></span>${fmt(p.chips)}</span>
        <div class="cardsrow">${p.revealed?faces:backs}</div>
      </div>`;
    arena.appendChild(el);
  });
}
function renderHand(popLast){
  const me=S.players.find(p=>p.pid===S.myPid);
  if(!me) return;
  const h=$("#hand"); h.innerHTML="";
  (me.cards||[]).forEach((c,i)=>{
    const src=cardFaceSrc(c);
    h.insertAdjacentHTML("beforeend",`<div class="pcard${popLast&&i===me.cards.length-1?" pop":""}"><img src="${src}" alt=""></div>`);
  });
  if((me.cards||[]).length<3 && S.phase==="myturn")
    h.insertAdjacentHTML("beforeend",'<div id="drawslot"><span style="font-size:20px">+</span>补牌位</div>');
  // 手牌信息
  if(me.cards&&me.cards.length){
    $("#handinfo .t1").innerHTML=`当前 <b>${me.handType||me.cards.length+"张"}</b>`;
    $("#handinfo .t2").textContent=me.handMult?`倍率 ×${me.handMult}`:"";
  }
}
function renderMe(){
  const me=S.players.find(p=>p.pid===S.myPid);
  if(!me) return;
  $("#mychips").textContent=fmt(me.chips);
  $("#myname").textContent=me.name;
  $("#mebanker").innerHTML=me.banker?'<div class="bankerbadge"></div>':"";
  const mr=$("#myraise"); if(mr) mr.style.display=me.raised?"block":"none";
}
function renderTop(){
  $("#roominfo").textContent=`房号 ${S.roomId} · 第 ${S.round} 局 · 底注 ${S.ante} · 池底 ${fmt(S.pot)}`;
  $("#pot").textContent=`池底 ${fmt(S.pot)}`;
}
function renderAll(){ renderSeats(); renderHand(); renderMe(); renderTop(); }
function setBanner(html){ $("#banner").innerHTML=`<b>${html}</b>`; }
function floaty(text,cls){
  const f=document.createElement("div"); f.className="floaty "+cls; f.textContent=text;
  $("#app").appendChild(f); setTimeout(()=>f.remove(),1700);
}
function flyCard(targetEl){
  return new Promise(res=>{
    const layer=$("#flylayer");
    const app=$("#app").getBoundingClientRect();
    const tr=targetEl.getBoundingClientRect();
    const x0=app.width/2-13, y0=$("#table").getBoundingClientRect().height*0.55;
    const x1=tr.left-app.left+tr.width/2-13, y1=tr.top-app.top+tr.height/2-18;
    const f=document.createElement("div"); f.className="flycard";
    f.style.left=x0+"px"; f.style.top=y0+"px";
    layer.appendChild(f);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      f.style.transform=`translate(${x1-x0}px,${y1-y0}px) rotate(${(Math.random()*180-90)|0}deg)`;
    }));
    setTimeout(()=>{ f.remove(); res(); }, 380);
  });
}

/* ---- 倒计时环 ---- */
let ringTimer=null;
function startRing(sec,onEnd,pid){
  const RING_C=2*Math.PI*24;
  let wrap,fgc,txt;
  if(pid===S.myPid){
    wrap=$("#myring"); fgc=$("#myfgc")||wrap.querySelector(".fgc"); txt=wrap.querySelector(".ringtxt");
    wrap.style.display="block"; const ma=$("#meavatar"); if(ma) ma.style.display="none";
  }else{
    const sw=document.querySelector(`.sebring[data-ring="${pid}"] .fgc`);
    if(!sw) return;
    wrap=sw.closest(".sebring"); fgc=sw; txt=wrap.querySelector(".ringtxt");
    wrap.style.display="block";
  }
  if(!fgc) return;
  const t0=Date.now(); S.ringOwner=pid; S.ringDeadline=t0+sec*1000; S.ringTotal=sec;
  fgc.setAttribute("stroke-dasharray",RING_C);
  const tick=()=>{
    const left=Math.max(0,sec-(Date.now()-t0)/1000);
    const frac=left/sec;
    fgc.setAttribute("stroke-dashoffset",RING_C*(1-frac));
    fgc.setAttribute("stroke",ringColor(frac));
    if(txt){ txt.textContent=Math.ceil(left); txt.style.color=frac<0.3?"#ffd0cc":"#fff"; }
    if(wrap) wrap.classList.toggle("urgent",frac<0.3);
    if(left<=0){ if(wrap)wrap.style.display="none"; if(pid===S.myPid){const ma=$("#meavatar");if(ma)ma.style.display="flex";} onEnd&&onEnd(); return; }
    ringTimer=setTimeout(tick,100);
  };
  clearTimeout(ringTimer); tick();
}
function stopRing(){
  clearTimeout(ringTimer);
  const mw=$("#myring"); if(mw) mw.style.display="none";
  const ma=$("#meavatar"); if(ma) ma.style.display="flex";
  document.querySelectorAll(".sebring").forEach(e=>e.style.display="none");
  if(typeof S!=="undefined"){ S.ringOwner=null; S.ringDeadline=0; }
}

/* ---- Socket.io ---- */
/* 同源(shanbox 子域名)连根路径即可；pages.dev 模式跨域指 musaiyu 子域名根 */
const SERVER_URL = location.hostname.includes("pages.dev")
  ? "https://musaiyu.shanbox.19930810.xyz:8443"
  : "";
let sock=null;
const st={count:0,raised:new Set()};

function connect(){
  const opts={path:"/musaiyu/socket.io/",transports:["websocket","polling"],reconnection:true,reconnectionDelay:1000,reconnectionDelayMax:8000};
  sock=SERVER_URL?io(SERVER_URL,opts):io(opts);
  sock.on("connect",()=>{
    $("#conn").textContent="已连接"; $("#conn").className="ok";
    $("#reconnect").classList.remove("show");
    sock.emit("join_room",{roomId:"lobby",name:"阿洲",face:"assets/avatars/avatar-m3.png"});
  });
  sock.on("disconnect",()=>{ $("#conn").textContent="断开"; $("#conn").className=""; $("#reconnect").classList.add("show"); });
  sock.on("joined",d=>{ S.myPid=d.pid; S.roomId=d.roomId; applyState(d.state); setBanner(d.state.phase==="waiting"?"等待玩家加入…":"对局进行中"); });
  sock.on("spectator",d=>{ S.myPid=null; S.roomId=d.roomId; applyState(d.state); setBanner("围观模式 · 本桌已满员"); });
  sock.on("rejoined",d=>{ applyState(d.state); setBanner(d.state.phase==="waiting"?"等待玩家加入…":"已重新接入对局"); });
  sock.on("room_created",d=>{ S.myPid=d.pid; S.roomId=d.roomId; applyState(d.state); setBanner("房间已创建 · 等待玩家加入…"); });
  sock.on("room_rejected",d=>{ setBanner(d.reason||"无法加入房间"); $("#conn").textContent="满员"; });
  sock.on("room_state",d=>applyState(d));
  sock.on("phase",d=>{ S.phase=d.phase; });
  sock.on("round_start",d=>{
    S.round=d.round; S.pot=d.pot; S.ante=d.ante;
    S.players.forEach(p=>{p.cards=[];p.folded=false;p.revealed=false;});
    renderTop(); setBanner("发牌中…");
  });
  sock.on("card_dealt",async d=>{
    const p=S.players.find(x=>x.pid===d.pid); if(!p) return;
    p.cards=p.cards||[]; p.cards.push({hidden:true});
    if(d.pid===S.myPid){
      // 我自己的牌: 飞入动画
      await flyCard($("#hand")); renderHand(true);
    } else {
      renderSeats(); await sleep(300);
    }
  });
  sock.on("your_cards",d=>{
    // 私发我的真实牌面
    const me=S.players.find(p=>p.pid===S.myPid);
    if(me){ me.cards=d.cards; renderHand(true); }
  });
  sock.on("forced_draw",d=>{
    setBanner(`${d.name} 单鬼 · 强制补牌`);
    const p=S.players.find(x=>x.pid===d.pid); if(p){p.cards.push({hidden:true}); renderSeats();}
  });
  sock.on("decision_turn",d=>{
    S.phase="myturn"===d.pid?S.phase:S.phase; // no-op
    if(d.pid===S.myPid){
      setBanner("轮到你 · 过 或 补一张");
      $("#btn-stop").disabled=false; $("#btn-draw").disabled=false;
      startRing(d.timeout||15,()=>{ $("#btn-stop").click(); }, S.myPid);
    } else {
      const p=S.players.find(x=>x.pid===d.pid);
      if(p){ p.inTurn=true; renderSeats(); }
      setBanner(`等待 ${d.name} 决策…`);
      startRing(d.timeout||15,()=>{},d.pid);
    }
  });
  sock.on("player_action",d=>{
    const p=S.players.find(x=>x.pid===d.pid); if(!p) return;
    p.inTurn=false;
    if(d.action==="draw") p.cards.push({hidden:true});
    setBanner(`${d.name} ${d.action==="pass"?"过":"补了一张"}`);
    renderSeats();
  });
  sock.on("reveal_all",d=>{
    setBanner("统一摊牌");
    for(const h of d.hands){
      const p=S.players.find(x=>x.pid===h.pid); if(!p) continue;
      p.cards=h.cards; p.revealed=true;
    }
    renderSeats();
  });
  sock.on("settle_result",d=>{
    S.phase="settle";
    for(const p of S.players){
      if(d.net[p.pid]!==undefined) p.chips+=d.net[p.pid];
    }
    renderAll();
    const net=d.net[S.myPid]||0;
    floaty((net>=0?"+":"")+fmt(net),net>=0?"plus":"minus");
    showSettle(d,net);
  });
}
function applyState(state){
  if(!state) return;
  S.players=(state.players||[]).map(p=>{
    const old=S.players.find(x=>x.pid===p.pid);
    return {...p,face:p.face||old?.face||"",cards:p.cards||old?.cards||[],chips:p.chips||0};
  });
  S.phase=state.phase; S.round=state.round; S.pot=state.pot; S.ante=state.ante;
  renderAll();
}
function showSettle(d,net){
  const tname={tianGong9:"天公9",tianGong8:"天公8",shuangGui:"双鬼",sanGui:"三鬼",zhenBaoZi:"豹子",
    tongHuaShun:"同花顺",jiaBaoZi:"假豹子",hunShun:"顺子",muShi:"木虱"};
  const rows=(d.pairs||[]).map(pr=>{
    if(!pr.w) return `<div class="srow"><span>${pr.p1.name} vs ${pr.p2.name}</span><span class="tie">平局</span></div>`;
    const W=pr.p1.id===pr.w?pr.p1:pr.p2, L=pr.w===pr.p1.id?pr.p1:pr.p2;
    return `<div class="srow"><span>${W.name}（${tname[pr.winType]||pr.winType} ×${pr.mult}）胜 ${L.name}</span><span class="win">±${fmt(pr.paid||0)}</span></div>`;
  }).join("");
  $("#overlay").classList.add("show");
  $("#panelbox").innerHTML=`<h3>第 ${S.round} 局结算</h3>${rows}
    <div class="stotal"><span>我净输赢</span><span style="color:${net>=0?"#7de3a8":"#ff8f86"};font-size:20px">${net>=0?"+":""}${fmt(net)}</span></div>
    <button class="ok" id="btn-next">下一局</button>`;
  $("#btn-next").onclick=()=>{ $("#overlay").classList.remove("show"); };
}
$("#btn-stop").onclick=()=>{ if(sock) sock.emit("player_action",{roomId:S.roomId,pid:S.myPid,action:"pass"}); };
$("#btn-draw").onclick=()=>{ if(sock) sock.emit("player_action",{roomId:S.roomId,pid:S.myPid,action:"draw"}); };
$("#specbtn").onclick=()=>$("#speclist").classList.toggle("show");

/* ---- 启动 ---- */
connect();
</script>
</body>
