<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>木虱鱼 · 闸坡厅</title>
<style>
:root{
  --gold:#d9b45c; --gold-hi:#f2ce78; --gold-dim:#9a7c34;
  --panel:rgba(8,20,16,.82); --line:rgba(217,180,92,.4);
  --green-hi:#9fe6bf; --btn-draw:#F4C447;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 40%,#0d5c3e,#073826 60%,#04241a);color:#fff;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#app{position:relative;margin:0 auto;height:100dvh;max-width:430px;width:100%;
  display:flex;flex-direction:column;background:#0a0a0c;overflow:hidden}

#statusbar{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:#000;font-size:11px;font-weight:600;color:#fff;z-index:6}
#topbar{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:linear-gradient(180deg,#15130c,#0a0906);border-bottom:1px solid var(--gold-dim);z-index:6}
#topbar .back{font-size:20px;color:var(--gold);width:22px;text-align:center}
#room{line-height:1.25;min-width:0}
#room b{font-size:13px;font-weight:700;white-space:nowrap}
#room small{display:block;font-size:10px;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .sp{flex:1}
.icobtn{width:28px;height:28px;border:none;background:transparent;color:var(--gold);font-size:15px;cursor:pointer}

#table{flex:1;position:relative;min-height:0;overflow:hidden;
  background:url(assets/table-v.jpg) center 38%/135% auto no-repeat, #04150f}
#table:before{content:"";position:absolute;inset:0;background:rgba(4,16,10,.22)}
#arena{position:absolute;inset:0}

.seat{position:absolute;display:flex;align-items:center;gap:5px;transform:translate(-50%,-50%);z-index:3}
.seat.v{flex-direction:column;gap:0;text-align:center;transform:translateX(-50%)}
.seat .avwrap{position:relative;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;background-size:cover;background-position:center}
.seat.h .avatar{width:36px;height:36px}
.seat.act .avwrap:after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2px solid #e5544b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bankerbadge{position:absolute;left:-6px;bottom:-2px;width:20px;height:20px;
  background:url(assets/banker-badge.png) center/cover}
.seatinfo{display:flex;flex-direction:column;gap:1px;min-width:0}
.seat.v .seatinfo{align-items:center}
.sname{font-size:10px;font-weight:600;color:rgba(255,255,255,.94);white-space:nowrap}
.schips{font-size:9.5px;color:#ffd97a;display:flex;align-items:center;gap:3px;white-space:nowrap}
.chip-ic{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e86a5e,#a01d16);border:1px dashed #ffd0a0;flex:none}
.cardsrow{display:flex;margin-top:2px}
.seat.h .cardsrow{margin-top:0}
.mcard{width:21px;height:30px;border-radius:3px;margin:0 -2px;
  background:url(assets/card-back.png) center/cover;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.seat.folded .cardsrow,.seat.folded .seatinfo{opacity:.35}

/* 翻牌 3D */
.card3d{display:inline-block;width:30px;height:42px;perspective:320px;margin:0 -2px}
.card3d .inner{position:relative;display:block;width:100%;height:100%;
  transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .55s}
.card3d .inner.flipped{transform:rotateY(0)}
.card3d .fface,.card3d .bback{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:4px;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.card3d .fface img{width:100%;height:100%;display:block}
.card3d .bback{transform:rotateY(180deg);background:url(assets/card-back.png) center/cover}

/* 飞牌 */
.flycard{position:absolute;width:26px;height:37px;border-radius:4px;z-index:14;
  background:url(assets/card-back.png) center/cover;box-shadow:0 3px 10px rgba(0,0,0,.6);
  transition:transform .34s cubic-bezier(.45,.1,.55,1)}
.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

#pot{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;
  font-size:11px;color:#ffd97a;background:rgba(0,0,0,.5);padding:3px 12px;border-radius:10px;white-space:nowrap}
#banner{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:3;
  padding:8px 18px;border-radius:10px;white-space:nowrap;text-align:center;
  background:linear-gradient(180deg,#1b2b22,#0c1a12);
  border:1.5px solid var(--gold);box-shadow:0 0 0 1px #0006,0 4px 14px #0009}
#banner b{color:var(--gold-hi);font-size:12.5px;letter-spacing:1px}
#specbtn{position:absolute;right:8px;top:12px;z-index:4;font-size:10px;color:#ffd97a;
  background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;padding:3px 8px;cursor:pointer}
#speclist{position:absolute;right:8px;top:38px;z-index:8;font-size:10px;color:#eee;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#speclist.show{display:block}

#mezone{flex:none;position:relative;z-index:5;padding:6px 14px 10px;
  background:linear-gradient(180deg,rgba(4,30,20,.18),rgba(3,14,9,.62) 55%);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border-top:1px solid rgba(217,180,92,.28)}
#meline{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#meavatar{width:42px;height:42px;border-radius:50%;flex:none;position:relative;
  border:2px solid var(--gold);background-size:cover;background-position:center}
/* 倒计时进度环(围着按钮/头像走一圈) */
.ring{position:absolute;border-radius:50%;pointer-events:none}
.ringwrap{position:relative;width:52px;height:52px;flex:none}
.sebring{position:absolute;inset:-9px;pointer-events:none}
.sebring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sebring .bgc{stroke:rgba(255,255,255,.14)}
.sebring .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear, stroke .3s linear}
.sebring.urgent .ringtxt{animation:urgentBlink .6s infinite alternate}
@keyframes urgentBlink{from{opacity:.55}to{opacity:1;transform:scale(1.15)}}
.sebring .ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringwrap .bgc{stroke:rgba(255,255,255,.12)}
.ringwrap .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringwrap .mid{position:absolute;inset:5px;border-radius:50%;background-size:cover;background-position:center}
.ringwrap .ringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--gold-hi);text-shadow:0 1px 4px #000}
/* 亮牌(天公等大牌) */
.face-up{display:flex;gap:2px}
.face-up .fc{width:26px;height:37px;border-radius:3px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1.5px rgba(217,180,92,.75), 0 2px 6px rgba(0,0,0,.55)}
.face-up .fc img{width:100%;height:100%;display:block}
.face-up .fc.pop{animation:pop .3s ease-out}
.bright{animation:brightPulse 1.1s ease-in-out infinite alternate}
@keyframes brightPulse{from{box-shadow:0 0 0 1.5px rgba(217,180,92,.5),0 0 6px rgba(242,206,120,.35)}
to{box-shadow:0 0 0 2px rgba(242,206,120,.95),0 0 16px rgba(242,206,120,.8)}}
#meavatar .bankerbadge{left:auto;right:-6px}
#meinfo b{font-size:13px;font-weight:600;white-space:nowrap}
#mechips{font-size:12px;color:#ffd97a;display:flex;align-items:center;gap:4px}
#handinfo{margin-left:auto;text-align:right;white-space:nowrap}
#handinfo .t1{font-size:12px;color:var(--green-hi)}
#handinfo .t1 b{color:#fff;font-size:15px}
#handinfo .t2{font-size:11px;color:#ffd97a}
#hand{display:flex;justify-content:center;align-items:center;gap:10px;min-height:116px;margin-bottom:8px}
.pcard{width:80px;height:114px;border-radius:8px;background:#fff;position:relative;
  box-shadow:0 4px 10px rgba(0,0,0,.5), 0 0 0 1.5px rgba(217,180,92,.55);flex:none;overflow:hidden}
.pcard img{width:100%;height:100%;display:block}
.pcard.pop{animation:pop .3s ease-out}
#drawslot{width:80px;height:114px;border-radius:8px;border:1.5px dashed rgba(255,255,255,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:rgba(255,255,255,.6);font-size:11px;flex:none}
#actions{display:flex;gap:10px}
.abtn{flex:1;height:48px;border-radius:16px;border:none;cursor:pointer;
  background-size:cover;background-position:center}
.abtn:disabled{opacity:.4;filter:grayscale(.4);cursor:default}
.abtn:not(:disabled):active{transform:translateY(1px)}
#btn-stop{background-image:url(assets/btn-pass.png)}
#btn-draw{background-image:url(assets/btn-draw.png)}
#home{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:#000}
#home i{width:110px;height:5px;border-radius:3px;background:#3a3a3e}

#overlay{position:absolute;inset:0;background:rgba(2,8,5,.74);z-index:20;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#overlay.show{display:flex}
.panel{width:88%;max-width:330px;background:linear-gradient(180deg,#12241b,#0a1712);
  border:1.5px solid var(--gold);border-radius:16px;padding:16px;max-height:82%;overflow:auto}
.panel h3{color:var(--gold-hi);font-size:15px;margin-bottom:10px;text-align:center}
.srow{display:flex;justify-content:space-between;font-size:12px;padding:5px 2px;
  border-bottom:1px dashed rgba(255,255,255,.12)}
.srow .win{color:#7de3a8;font-weight:700}.srow .tie{color:#ccc}
.stotal{display:flex;justify-content:space-between;font-size:14px;font-weight:800;margin-top:10px}
/* 对阵乘法表 */
.mxwrap{overflow-x:auto;overflow-y:hidden;margin:10px -6px 0;padding:0 6px;-webkit-overflow-scrolling:touch}
table.mx{border-collapse:separate;border-spacing:2px;font-size:10px;margin:0 auto}
table.mx th,table.mx td{padding:2px;text-align:center;white-space:nowrap}
table.mx thead th{vertical-align:bottom}
table.mx .hname{font-size:10px;color:rgba(255,255,255,.85);font-weight:600;line-height:1.1}
table.mx .hcards{display:flex;gap:1px;justify-content:center;margin-top:3px}
table.mx .hsub{font-size:9.5px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
table.mx .hsub.pos{color:#7de3a8}.table.mx .hsub.neg{color:#ff8f86}
table.mx .hc{width:16px;height:22px;border-radius:2px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1px rgba(217,180,92,.75)}
table.mx .hc img{width:100%;height:100%;display:block}
table.mx td{width:48px;height:30px;border-radius:4px;background:rgba(255,255,255,.05);
  font-variant-numeric:tabular-nums;font-size:11px;font-weight:600}
table.mx td.win{background:rgba(39,174,96,.2);color:#8ff0b4;font-weight:700}
table.mx td.lose{background:rgba(192,57,43,.16);color:#ffa79e;font-weight:700}
table.mx td.tie{color:#8b9a94}
table.mx th.rowh{background:rgba(217,180,92,.12);border-radius:4px;padding:3px 5px;text-align:right}
table.mx tr.me th.rowh{background:rgba(217,180,92,.3);color:#ffe6a0}
table.mx tr.me td{box-shadow:inset 0 0 0 1px rgba(217,180,92,.35)}
table.mx th.meh{background:rgba(217,180,92,.3);border-radius:4px}
table.mx .diag{background:rgba(255,255,255,.02)}
.mxtitle{text-align:center;font-size:11px;color:#9fb8ac;margin-top:2px}
/* 视图切换 */
.viewtabs{display:flex;gap:6px;margin:2px 0 10px}
.vt{flex:1;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;
  color:#ffd97a;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.vt.sel{background:rgba(217,180,92,.24);border-color:var(--gold);color:#fff}
.vt:hover:not(.sel){background:rgba(217,180,92,.10)}
/* 排行视图 */
.lbrow{display:flex;align-items:center;gap:7px;padding:5px 4px;border-bottom:1px dashed rgba(255,255,255,.09)}
.lbrow.me{background:rgba(217,180,92,.14);border-radius:8px;border-bottom-color:transparent}
.lbrank{width:16px;text-align:center;font-size:11px;color:#8b9a94;font-weight:700}
.lbrow.me .lbrank{color:var(--gold-hi)}
.lbav{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;flex:none}
.lbname{font-size:11.5px;font-weight:600;width:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbcards{display:flex;gap:1px;flex:none}
.lbcards .hc{width:14px;height:19px;border-radius:2px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(217,180,92,.6)}
.lbcards .hc img{width:100%;height:100%;display:block}
.lbbar{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;min-width:20px}
.lbfill{position:absolute;top:0;bottom:0;border-radius:5px}
.lbamt{width:62px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.lbamt.pos{color:#7de3a8}.lbamt.neg{color:#ff8f86}
/* 我的对局视图 */
.mmrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed rgba(255,255,255,.09)}
.mmside{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.mmside .mmcards{display:flex;gap:1px}
.mmside .mmcards .hc{width:17px;height:24px;border-radius:2px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(217,180,92,.65)}
.mmside .mmcards .hc img{width:100%;height:100%;display:block}
.mmwho{font-size:10px;color:#9fb8ac}
.mmvs{font-size:11px;color:#7d8c86;font-weight:700;flex:none}
.mmres{flex:none;text-align:right;min-width:64px}
.mmres .amt{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.mmres .amt.pos{color:#7de3a8}.mmres .amt.neg{color:#ff8f86}.mmres .amt.tie{color:#9fb8ac}
.mmres .ht{font-size:9.5px;color:#ffd97a;margin-top:1px}
.panel .ok{margin-top:14px;width:100%;height:44px;border-radius:14px;border:none;
  background:linear-gradient(180deg,#f7d67a,var(--btn-draw));color:#3d2c05;font-weight:800;font-size:15px;cursor:pointer}
.betrow{display:flex;gap:10px;margin:12px 0}
.betopt{flex:1;height:52px;border-radius:12px;border:1.5px solid var(--line);background:#0d1f16;
  color:#ffd97a;font-size:15px;font-weight:800;cursor:pointer}
.betopt.sel{border-color:var(--gold);background:#1b3a2a;box-shadow:0 0 0 2px rgba(217,180,92,.35)}
.note{font-size:10.5px;color:#9fb8ac;text-align:center;margin-top:6px}
#home2{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:#000}
#home2 i{width:110px;height:5px;border-radius:3px;background:#3a3a3e}
.floaty{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:16;
  font-size:30px;font-weight:900;pointer-events:none;animation:floaty 1.6s ease-out forwards;text-shadow:0 2px 10px #000}
.floaty.plus{color:#7de3a8}.floaty.minus{color:#ff8f86}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scale(1.15)}}
@media (max-height:700px){
  #hand{min-height:100px}.pcard,#drawslot{width:68px;height:98px}
  #meavatar{width:36px;height:36px}
}
</style>
</head>
<body>
<div id="app">
  <div id="statusbar"><span>9:41</span><span>木虱鱼</span><span>▂▄▆</span></div>
  <div id="topbar">
    <span class="back">‹</span>
    <div id="room"><b>木虱鱼 · 闸坡厅</b><small id="roominfo"></small></div>
    <span class="sp"></span>
    <button class="icobtn">🔊</button><button class="icobtn">⚙</button>
  </div>
  <div id="table">
    <div id="arena"></div>
    <div id="pot">池底 0</div>
    <div id="banner"><b>准备中</b></div>
    <button id="specbtn">围观 ×2</button>
    <div id="speclist">围观中：路人甲、路人乙</div>
    <div id="flylayer" style="position:absolute;inset:0;pointer-events:none;z-index:14"></div>
  </div>
  <div id="mezone">
    <div id="meline">
      <div class="ringwrap" id="myring" style="display:none">
        <svg viewBox="0 0 52 52"><circle class="bgc" cx="26" cy="26" r="24" fill="none" stroke-width="3"/>
        <circle class="fgc" id="myfgc" cx="26" cy="26" r="24" fill="none" stroke-width="3"
          stroke-dasharray="150.8" stroke-dashoffset="0"/></svg>
        <div class="mid" style="background-image:url('assets/avatars/avatar-m3.png')"></div>
        <div class="ringtxt" id="myringtxt">15</div>
        <span id="mebanker" style="position:absolute;right:-6px;bottom:2px"></span>
      </div>
      <div id="meavatar"><span id="mebanker2"></span></div>
      <div id="meinfo">
        <b>阿洲（我 · 庄底位）</b>
        <div id="mechips"><span class="chip-ic"></span><span id="mychips">12,400</span></div>
      </div>
      <div id="handinfo"><div class="t1">—</div><div class="t2"></div></div>
    </div>
    <div id="hand"><div id="drawslot"><span style="font-size:20px">+</span>补牌位</div></div>
    <div id="actions">
      <button class="abtn" id="btn-stop" aria-label="过" disabled></button>
      <button class="abtn" id="btn-draw" aria-label="补一张" disabled></button>
    </div>
  </div>
  <div id="home2"><i></i></div>
  <div id="overlay"><div class="panel" id="panelbox"></div></div>
</div>
<script>
"use strict";
/* ---------- 规则预设 duobi-v1（已冻结，不与其他版本混用） ---------- */
const PRESET = {
  name: "duobi-v1",
  startCards: 2,                   // 起手 2 张(SPEC: 起手2+补1=最多3)
  maxCards: 3,                     // 最多 3 张
  deckSize: 55,                 // 52 + 大小王 + 1 张万能鬼（v1.1 冻结：使三鬼可达，同源码版牌组）
  straightAce: ["QKA","A23"],   // QKA、A23 成顺；KA2 不成
  // R2 冻结顺序: 双鬼＞天公9＞天公8＞三鬼＞真豹子＞同花顺＞假豹子＞混顺＞普通＞木虱
  order: ["shuangGui","tianGong9","tianGong8","sanGui","zhenBaoZi","tongHuaShun","jiaBaoZi","hunShun","normal","muShi"],
  mult: { shuangGui:10, sanGui:15, zhenBaoZi:10, tongHuaShun:8, jiaBaoZi:6, hunShun:4, muShiAntiShuangGui:10, normal:1 },
  special: {
    muShiBeatsShuangGui: true,     // 循环克制: 木虱反克双鬼(双向显式)
    sanGuiLosesToTianGong: true,   // 三鬼输天公9/8（双向显式, R2 明确）
    tianGongNaturalOnly: true,     // 天公必须无鬼（源码证据）
    shuangGuiPlusNormalAsShuangGui: true, // 双鬼+1普通 → 冻结为按双鬼(10倍)
    jokerTongHuaShunAsTongHuaShun: true,  // 含鬼同花顺 → 同花顺8倍
    jokerBaoZiAsJiaBaoZi: true,           // 含鬼豹子 → 假豹子6倍
  },
  tiePolicy: "push",
};

/* ---------- 牌 ---------- */
const SUITS = ["♠","♥","♣","♦"];
const SUIT_L = {"♠":"S","♥":"H","♣":"C","♦":"D"};
const RANK_STR = {1:"A",11:"J",12:"Q",13:"K"};
function rankStr(r){ return RANK_STR[r] || String(r); }
function buildDeck(){
  const d=[];
  for(const s of SUITS) for(let r=1;r<=13;r++) d.push({suit:s,rank:r,joker:false});
  d.push({suit:"🃏",rank:0,joker:true,red:true});
  d.push({suit:"🃏",rank:0,joker:true,red:false});
  d.push({suit:"☆",rank:0,joker:true,red:true});   // 第3张万能鬼(v1.1, 使三鬼可达)
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pip(c){ return c.joker?0:(c.rank>10?10:c.rank); }
function points(cs){ return cs.filter(c=>!c.joker).reduce((s,c)=>s+pip(c),0)%10; }

/* ---------- 引擎 1: classifyHand —— 牌型识别（顺序即优先级来源，比较走 compareHands） ---------- */
function classifyHand(cards){
  const jokers = cards.filter(c=>c.joker).length;
  const natural = jokers===0;
  const n = cards.length;
  const isSameSuit = natural && cards.every(c=>c.suit===cards[0].suit);
  const isTriplet  = natural && n===3 && cards.every(c=>c.rank===cards[0].rank);
  const isPair2    = n===2 && natural && cards[0].rank===cards[1].rank;
  const isFlush    = natural && isSameSuit;
  const straightOf = cs => {
    if(cs.length!==3 || cs.some(c=>c.joker)) return false;
    const rs=[...new Set(cs.map(c=>c.rank))].sort((a,b)=>a-b);
    if(rs.length<3) return false;
    const s=rs.join(",");
    if(s==="1,12,13") return PRESET.straightAce.includes("QKA");  // QKA 成顺
    if(s==="1,2,13") return false;                                 // KA2 不成(duobi-v1 冻结)
    if(s==="1,2,3") return PRESET.straightAce.includes("A23");
    return rs[2]-rs[0]===2 && rs[1]-rs[0]===1;
  };
  const isStraight = straightOf(cards);

  // 含鬼牌组合
  if(jokers===3 && n===3) return {type:"sanGui",pts:0};   // 三鬼(需55张牌组的第3张万能鬼)
  if(jokers===2 && n===2) return {type:"shuangGui",pts:0};
  if(jokers===2 && n===3) return PRESET.special.shuangGuiPlusNormalAsShuangGui
      ? {type:"shuangGui",pts:0} : {type:"normal",pts:points(cards)};
  if(jokers===1 && n===3){
    // 含鬼同花顺：鬼补成同色顺子（简化：剩两张同花且点差≤2 视为可成顺）
    const rest=cards.filter(c=>!c.joker);
    const canSF = rest[0].suit===rest[1].suit && Math.abs(pip(rest[0])-pip(rest[1]))<=2;
    if(PRESET.special.jokerTongHuaShunAsTongHuaShun && canSF) return {type:"tongHuaShun",pts:points(cards),joker:true};
  }
  if(jokers===1 && n===2) return {type:"normal",pts:points(cards)};

  // 天然牌型
  if(natural){
    if(n===2){
      if(points(cards)===9) return {type:"tianGong9",pts:9,multBonus:isFlush||isPair2?2:1};
      if(points(cards)===8) return {type:"tianGong8",pts:8,multBonus:isFlush||isPair2?2:1};
    }
    if(n===3){
      if(isSameSuit&&isStraight) return {type:"tongHuaShun",pts:points(cards)};
      if(isTriplet) return {type:"zhenBaoZi",pts:points(cards)};
      if(isStraight) return {type:"hunShun",pts:points(cards)};
    }
    if(points(cards)===0) return {type:"muShi",pts:0};
  }
  // 含鬼三张的豹子（鬼当任意点）
  if(jokers===1 && n===3){
    const rest=cards.filter(c=>!c.joker);
    if(rest[0].rank===rest[1].rank) return PRESET.special.jokerBaoZiAsJiaBaoZi
      ? {type:"jiaBaoZi",pts:points(cards),joker:true} : {type:"normal",pts:points(cards)};
  }
  return {type:"normal",pts:points(cards)};
}

/* ---------- 引擎 2: compareHands —— 两两比较（表驱动 + 双向反克，禁止总分排序） ---------- */
function compareHands(A,B){
  const a=classifyHand(A), b=classifyHand(B);
  const ORD=PRESET.order, idx=t=>ORD.indexOf(t);
  // 循环克制：双向显式
  if(PRESET.special.muShiBeatsShuangGui){
    if(a.type==="muShi"&&b.type==="shuangGui") return {r:1,a,b};
    if(a.type==="shuangGui"&&b.type==="muShi") return {r:-1,a,b};
  }
  // 三鬼输天公（双向）
  if(PRESET.special.sanGuiLosesToTianGong){
    if(a.type==="sanGui"&&(b.type==="tianGong9"||b.type==="tianGong8")) return {r:-1,a,b};
    if(b.type==="sanGui"&&(a.type==="tianGong9"||a.type==="tianGong8")) return {r:1,a,b};
  }
  const ia=idx(a.type), ib=idx(b.type);
  if(ia!==ib) return {r:ia<ib?1:-1,a,b};
  if(a.type!=="normal"&&a.type!=="muShi") return {r:0,a,b};   // 特殊牌型同级判平
  if(a.pts!==b.pts) return {r:a.pts>b.pts?1:-1,a,b};
  return {r:0,a,b};                                            // 平局 push
}

/* ---------- 引擎 3: payoutMultiplier —— 赢家的结算倍率（牌型大小与倍率分离） ---------- */
function payoutMultiplier(res){
  const m=PRESET.mult;
  switch(res.type){
    case "shuangGui": return m.shuangGui;
    case "sanGui": return m.sanGui;
    case "zhenBaoZi": return m.zhenBaoZi;
    case "tongHuaShun": return m.tongHuaShun;
    case "jiaBaoZi": return m.jiaBaoZi;
    case "hunShun": return m.hunShun;
    case "muShi": return m.muShiAntiShuangGui;   // 木虱只在反克双鬼时赢, 倍率10
    case "tianGong9": case "tianGong8": return res.multBonus||1;
    default: { // normal: 两张同花/对子 ×2, 三张同花 ×3
      const cs=res._cards||[];
      const nat=cs.filter(c=>!c.joker);
      const flush=nat.length===cs.length&&cs.every(c=>c.suit===cs[0].suit);
      const pair=cs.length===2&&cs[0].rank===cs[1].rank;
      if(cs.length===3&&flush) return 3;
      if((cs.length===2&&flush)||pair) return 2;
      return m.normal;
    }
  }
}

/* ---------- 引擎 4: settleRound —— 全员互比逐对结算（冻结: 净输赢=底注×倍率, 平局0） ---------- */
function settleRound(players){
  const ledger=Object.fromEntries(players.map(p=>[p.id,0]));
  // 可支付余额随结算递减: 一人连输多对时累计扣款不超过其余额(审查二轮修复)
  const avail=Object.fromEntries(players.map(p=>[p.id,p.chips]));
  const pairs=[];
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const P=players[i],Q=players[j];
    const {r,a,b}=compareHands(P.cards,Q.cards);
    if(r===0){pairs.push({w:null,p1:P,p2:Q,mult:0,paid:0});continue;}
    const W=r>0?P:Q, L=r>0?Q:P;
    const Wr=classifyHand(W.cards);
    const mult=payoutMultiplier({...Wr,_cards:W.cards});
    // 封顶赔付: 实际转账不超过输家当前可支付余额, 赢加=输减, 禁止负数
    const delta=Math.min(W.stake*mult, Math.max(0,avail[L.id]));
    avail[L.id]-=delta; avail[W.id]+=delta;
    ledger[W.id]+=delta; ledger[L.id]-=delta;
    pairs.push({w:W.id,p1:P,p2:Q,mult,winType:Wr.type,paid:delta});
  }
  return {ledger,pairs};
}



/* ---------- 自测：SPEC 15 条 case 中的关键判定 ---------- */

  eq("平局: 同为7点", compareHands([C("♠",3),C("♥",4)],[C("♣",3),C("♦",4)]).r, 0);
  eq("同花天公9 ×2", payoutMultiplier({...classifyHand([C("♠",4),C("♠",5)]),_cards:[C("♠",4),C("♠",5)]}), 2);
  eq("对子天公8 ×2", payoutMultiplier({...classifyHand([C("♠",4),C("♥",4)]),_cards:[C("♠",4),C("♥",4)]}), 2);
  eq("含鬼豹子→假豹子6", classifyHand([C("♠",9),C("♥",9),J(true)]).type, "jiaBaoZi");
  eq("假豹子倍率6", payoutMultiplier({...classifyHand([C("♠",9),C("♥",9),J(true)]),_cards:[C("♠",9),C("♥",9),J(true)]}), 6);
  eq("封顶赔付: 连输多对累计不超余额且守恒", (()=>{
    const ps=[{id:"a",cards:[C("♠",3),C("♥",7)],stake:1000,chips:300},
              {id:"b",cards:[C("♠",4),C("♥",5)],stake:1000,chips:5000},
              {id:"c",cards:[C("♣",6),C("♦",6)],stake:1000,chips:5000}];
    const {ledger}=settleRound(ps);
    const zeroSum=ledger.a+ledger.b+ledger.c===0;
    const noNeg=Object.entries(ledger).every(([id,v])=>v>=-({a:300,b:5000,c:5000})[id]);
    // a 连输两对: 第1对封顶付300, 第2对余额0付0; b 还赢 c 一对 1000
    const capped=ledger.a===-300&&ledger.b===1300&&ledger.c===-1000;
    return zeroSum&&noNeg&&capped;
  })(), true);
  return t;
}

function ringColor(frac){        // frac: 剩余比例 1=刚开始 0=结束
  const stops=[[0,"#e5544b"],[0.5,"#f2ce78"],[1,"#3ddc84"]];
  const f=Math.max(0,Math.min(1,frac));

      const a=hx(c0), b=hx(c1);
      const mix=a.map((v,k)=>Math.round(v+(b[k]-v)*t));
      return `rgb(${mix[0]},${mix[1]},${mix[2]})`;
    }
  }
  return "#3ddc84";
}

  const tick=()=>{

function stopRing(){
  clearTimeout(ringTimer);
  if(typeof S!=="undefined"){ S.ringOwner=null; S.ringDeadline=0; }
  const mw=$("#myring"); if(mw) mw.style.display="none";
  const ma=$("#meavatar"); if(ma) ma.style.display="flex";
  document.querySelectorAll(".sebring").forEach(e=>e.style.display="none");
}
let ringTimer=null;
const MY_TURN_SEC=15, AI_TURN_SEC=5;
function floaty(text,cls){
  const f=document.createElement("div"); f.className="floaty "+cls; f.textContent=text;
  $("#app").appendChild(f); setTimeout(()=>f.remove(),1700);
}

/* ---------- 动画: 飞牌 ---------- */
function flyCard(targetEl){
  return new Promise(res=>{
    const layer=$("#flylayer");
    const app=$("#app").getBoundingClientRect();
    const tr=targetEl.getBoundingClientRect();
    const x0=app.width/2-13, y0=$("#table").getBoundingClientRect().height*0.55;
    const x1=tr.left-app.left+tr.width/2-13, y1=tr.top-app.top+tr.height/2-18;
    const f=document.createElement("div"); f.className="flycard";
    f.style.left=x0+"px"; f.style.top=y0+"px";
    layer.appendChild(f);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      f.style.transform=`translate(${x1-x0}px,${y1-y0}px) rotate(${(Math.random()*180-90)|0}deg)`;
    }));
    setTimeout(()=>{ f.remove(); res(); }, SPEED?380:1);
  });
}
function popLastBack(pid){
  const el=seatEl(pid); if(!el) return;
  const cards=el.querySelectorAll(".cardsrow .mcard");
  const last=cards[cards.length-1]; if(last) last.classList.add("pop");
}

/* ---------- 流程 ---------- */
function makePlayers(n,ante){
  const ps=[];
  ps.push({id:"me",me:true,name:"阿洲",face:"assets/avatars/avatar-m3.png",chips:12400,cards:[],stake:ante,banker:false});
  for(let i=0;i<n-1;i++) ps.push({id:"ai"+i,me:false,name:AI_NAMES[i],face:AI_FACE[i],chips:3000+i*1777,cards:[],stake:ante,banker:false});
  ps[S.bankerSeq%n].banker=true;
  return ps;
}
async function startRound(){
  S.round++; S.phase="betting"; S.pot=0;
  if(!S.players.length) S.players=makePlayers(9,S.ante);
  else { S.bankerSeq++; S.players.forEach(p=>{p.banker=false;p.cards=[];p.folded=false;p.inTurn=false;});
         S.players[S.bankerSeq%S.players.length].banker=true; }
  renderAll(); setBanner("选择底注开局");
  $("#overlay").classList.add("show");
  $("#panelbox").innerHTML=`<h3>第 ${S.round} 局 · 下注</h3>
    <div class="betrow">
      ${[200,500,1000].map(v=>`<button class="betopt${v===S.ante?" sel":""}" data-v="${v}">底注 ${v}</button>`).join("")}
    </div>
    <div class="note">duobi-v1 · 全员互比 · 平局不输不赢 · 满员 ${S.players.length} 人</div>
    <button class="ok" id="btn-go">发 牌</button>`;
  $("#panelbox").querySelectorAll(".betopt").forEach(b=>b.onclick=()=>{
    S.ante=+b.dataset.v;
    $("#panelbox").querySelectorAll(".betopt").forEach(x=>x.classList.toggle("sel",x===b));
    S.players.forEach(p=>p.stake=Math.max(1,Math.min(S.ante,p.chips)));
  });
  $("#btn-go").onclick=()=>{ $("#overlay").classList.remove("show"); deal(); };
}
function dealOrder(){
  const n=S.players.length, bi=S.players.findIndex(p=>p.banker);
  const order=[];
  for(let r=0;r<PRESET.startCards;r++) for(let k=1;k<=n;k++) order.push(S.players[(bi+k)%n]);
  return order;
}
async function deal(){
  S.phase="dealing";
  $("#btn-stop").disabled=true; $("#btn-draw").disabled=true;
  const deck=shuffle(buildDeck());
  S.players.forEach(p=>{p.cards=[];p.folded=false;});
  S.pot=S.players.reduce((s,p)=>s+p.stake,0);
  renderAll(); setBanner("发牌中…");
  for(const p of dealOrder()){
    await flyCard(p.me ? $("#hand") : seatEl(p.id));
    p.cards.push(deck.pop());
    p.me ? renderHand(true) : (renderSeats(), popLastBack(p.id));
  }
  await sleep(250);
  // 起手单鬼强制补
  for(const p of dealOrder()){
    if(p.cards.filter(c=>c.joker).length===1 && p.cards.length<PRESET.maxCards){
      setBanner(`${p.name} 单鬼 · 强制补牌`);
      await flyCard(p.me ? $("#hand") : seatEl(p.id));
      p.cards.push(deck.pop());
      p.me ? renderHand(true) : renderSeats();
      await sleep(200);
    }
  }
  decisionLoop(deck);
}
async function decisionLoop(deck){
  S.phase="decision";
  for(const p of S.players){
    if(p.cards.length>=PRESET.maxCards) continue;
    if(p.me){
      p.inTurn=true; S.phase="myturn"; renderSeats();
      const canDraw=p.cards.length<PRESET.maxCards;
      renderHand();   // 进入我回合后重绘: 补牌位此时才显示
      setBanner(canDraw?"轮到你 · 过 或 补一张":"轮到你 · 过");
      $("#btn-stop").disabled=false; $("#btn-draw").disabled=!canDraw;
      $("#btn-draw").style.display=canDraw?"flex":"none";
      let done=false;
      let resolveTurn=null;
      const turnPromise=new Promise(r=>{ resolveTurn=r; });
      // 补牌入口(补牌位 / 补一张按钮 共用)
      const doDraw=()=>{
        if(done||!canDraw) return;
        done=true; clearTimeout(ringTimer); stopRing();
        p.cards.push(deck.pop());
        renderHand(true);
        S.onDrawRequest=null; S.phase="decision";
        p.inTurn=false; $("#btn-stop").disabled=true; $("#btn-draw").disabled=true;
        renderSeats(); setBanner("你补了一张");
        if(resolveTurn){ resolveTurn("draw"); resolveTurn=null; }
      };
      S.onDrawRequest=doDraw;
      const finish=(act)=>{ if(done) return; done=true; clearTimeout(ringTimer); stopRing();
        S.onDrawRequest=null; S.phase="decision";
        p.inTurn=false; $("#btn-stop").disabled=true; $("#btn-draw").disabled=true;
        $("#btn-draw").style.display="flex";
        if(resolveTurn){ resolveTurn(act); resolveTurn=null; } };
      $("#btn-stop").onclick=()=>finish("pass");
      $("#btn-draw").onclick=()=>doDraw();
      startRing(MY_TURN_SEC, ()=>{ setBanner("超时 · 自动过"); finish("pass"); }, "me");
      await turnPromise;
      renderSeats();
    } else {
      p.inTurn=true; renderSeats();
      setBanner(`等待 ${p.name} 决策…`);
      startRing(AI_TURN_SEC, ()=>{}, p.id);
      await sleep(AI_TURN_SEC*1000*0.72);
      stopRing();
      const r=classifyHand(p.cards);
      const good=["tianGong9","tianGong8","shuangGui","sanGui","zhenBaoZi","tongHuaShun","hunShun"].includes(r.type)||r.pts>=7;
      if(!good&&p.cards.length<PRESET.maxCards&&Math.random()<0.8){
        p.cards.push(deck.pop());
        setBanner(`${p.name} 补了一张`); renderSeats(); await sleep(600);
      } else { setBanner(`${p.name} 过`); renderSeats(); await sleep(450); }
      p.inTurn=false; renderSeats();
    }
  }
  S.phase="decision";
  reveal();
}
async function reveal(){
  S.phase="reveal";
  setBanner("统一摊牌");
  const opps=S.players.filter(p=>!p.me);
  for(const p of opps){
    const el=seatEl(p.id); if(!el) continue;
    const row=el.querySelector(".cardsrow");
    if(row&&p.cards.length){
      row.innerHTML=p.cards.map(c=>`<span class="card3d"><span class="inner"><span class="fface"><img src="${cardFaceSrc(c)}"></span><span class="bback"></span></span></span>`).join("");
      await sleep(60);
      row.querySelectorAll(".inner").forEach(x=>x.classList.add("flipped"));
      const rres=classifyHand(p.cards);
      const NM={tianGong9:"天公9",tianGong8:"天公8",shuangGui:"双鬼",sanGui:"三鬼",zhenBaoZi:"豹子",tongHuaShun:"同花顺",jiaBaoZi:"假豹子",hunShun:"顺子",muShi:"木虱",normal:rres.pts+"点"};
      setBanner(`${p.name}：${NM[rres.type]}`);
      await sleep(SPEED?650:1);
    }
  }
  settle();
}
function settle(){
  S.phase="settle";
  const {ledger,pairs}=settleRound(S.players);
  const me=S.players[S.myIdx];
  for(const p of S.players) p.chips+=ledger[p.id];
  const net=ledger[me.id];
  renderAll();
  floaty((net>=0?"+":"")+fmt(net), net>=0?"plus":"minus");
  setBanner(`本局结算 · 我 ${net>=0?"+":""}${fmt(net)}`);

  // 对阵数据: Map "idA_idB" -> A 在与 B 这对中的金额(正=赢), "idA_idB" -> 赢方牌型
  const ps=S.players, n=ps.length;
  const cell=new Map(), wtype=new Map();
  const key=(a,b)=>a+"_"+b;
  for(const pr of pairs){
    if(!pr.w){ cell.set(key(pr.p1.id,pr.p2.id),0); cell.set(key(pr.p2.id,pr.p1.id),0);
               wtype.set(key(pr.p1.id,pr.p2.id),"tie"); continue; }
    const winnerId=pr.w;
    const loserId=(pr.p1.id===pr.w)? pr.p2.id : pr.p1.id;
    const amt=pr.paid||0;
    cell.set(key(winnerId,loserId), amt);
    cell.set(key(loserId,winnerId), -amt);
    wtype.set(key(winnerId,loserId), pr.winType);
  }
  // 玩家顺序: 其他人在前, 我在最后 -> 内容落在左下三角, 我的行最长且在底部
  const order=ps.filter(p=>!p.me).concat(ps.filter(p=>p.me));
  const TN={tianGong9:"天公9",tianGong8:"天公8",shuangGui:"双鬼",sanGui:"三鬼",zhenBaoZi:"豹子",
    tongHuaShun:"同花顺",jiaBaoZi:"假豹子",hunShun:"顺子",muShi:"木虱",normal:"普通"};
  const mini=c=>`<span class="hc"><img src="${cardFaceSrc(c)}"></span>`;
  const cardsOf=p=>(p.cards||[]).map(mini).join("");

  /* ---- 视图1: 排行(按净额, 我高亮) ---- */
  const maxAbs=Math.max(1,...ps.map(p=>Math.abs(ledger[p.id]||0)));
  const rank=ps.slice().sort((a,b)=>(ledger[b.id]||0)-(ledger[a.id]||0));
  const viewRank=rank.map((p,i)=>{
    const v=ledger[p.id]||0, w=Math.abs(v)/maxAbs*100;
    return `<div class="lbrow ${p.me?"me":""}">
      <span class="lbrank">${i+1}</span>
      <span class="lbav" style="background-image:url('${p.face}')"></span>
      <span class="lbname">${p.name}</span>
      <span class="lbcards">${cardsOf(p)}</span>
      <span class="lbbar"><span class="lbfill" style="width:${w}%;${v>=0?"left:0;background:rgba(39,174,96,.55)":"right:0;background:rgba(192,57,43,.5)"}"></span></span>
      <span class="lbamt ${v>=0?"pos":"neg"}">${v>=0?"+":""}${fmt(v)}</span></div>`;
  }).join("");

  /* ---- 视图2: 我的对局(只看我跟每个人的那对) ---- */
  const myPairs=ps.filter(q=>!q.me).map(q=>{
    const v=cell.get(key(S.myIdx,q.id))||0;
    const wt=(v>0)? wtype.get(key(S.myIdx,q.id)) : (v<0? wtype.get(key(q.id,S.myIdx)) : "tie");
    const winCards = v>0? me.cards : q.cards;
    const res=v>0? "胜" : v<0? "负" : "平";
    return `<div class="mmrow">
      <div class="mmside">
        <div class="mmcards">${cardsOf(q)}</div>
        <span class="mmwho">${q.name}</span>
      </div>
      <span class="mmvs">VS</span>
      <div class="mmside">
        <div class="mmcards">${cardsOf(me)}</div>
        <span class="mmwho">我</span>
      </div>
      <div class="mmres">
        <div class="amt ${v>0?"pos":v<0?"neg":"tie"}">${v>0?"+":""}${fmt(v)}</div>
        <div class="ht">${res} ${TN[wt]||wt}</div>
      </div>
    </div>`;
  }).join("");

  /* ---- 视图3: 对阵表(上三角, 每对一次) ---- */
  const head=order.map(p=>{ const nv=ledger[p.id]||0;
    return `<th class="${p.me?"meh":""}"><div class="hname">${p.name}</div>
    <div class="hcards">${cardsOf(p)}</div>
    <div class="hsub ${nv>=0?"pos":"neg"}">${nv>=0?"+":""}${fmt(nv)}</div></th>`;}).join("");
  const body=order.map((p,i)=>{
    const cells=order.map((q,j)=>{
      if(j>=i) return `<td class="diag"></td>`;          // 上三角留空 -> 内容在左下
      const v=cell.get(key(p.id,q.id))||0;
      if(v===0) return `<td class="tie">平</td>`;
      const wt=wtype.get(key(p.id,q.id))||"";
      return `<td class="${v>0?"win":"lose"}" title="${TN[wt]||wt}">${v>0?"+":""}${fmt(v)}</td>`;
    }).join("");
    return `<tr class="${p.me?"me":""}"><th class="rowh"><div class="hname">${p.name}</div><div class="hcards">${cardsOf(p)}</div></th>${cells}</tr>`;
  }).join("");

  const VIEWS={
    rank:`<div class="lbhead"></div>${viewRank}`,
    mine: myPairs,
    matrix:`<div class="mxwrap"><table class="mx"><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <div class="mxtitle">左下三角显示，每对只出现一次；最后一行是我</div>`
  };
  $("#overlay").classList.add("show");
  $("#panelbox").innerHTML=`<h3>第 ${S.round} 局 · 结算</h3>
    <div class="viewtabs">
      <button class="vt sel" data-v="rank">排行</button>
      <button class="vt" data-v="mine">我的对局</button>
      <button class="vt" data-v="matrix">对阵表</button>
    </div>
    <div id="viewbox">${VIEWS.rank}</div>
    <div class="stotal"><span>我本局净输赢</span><span style="color:${net>=0?"#7de3a8":"#ff8f86"};font-size:20px">${net>=0?"+":""}${fmt(net)}</span></div>
    <button class="ok" id="btn-next">下一局</button>`;
  const vb=$("#viewbox");
  $("#panelbox").querySelectorAll(".vt").forEach(btn=>{
    btn.onclick=()=>{
      $("#panelbox").querySelectorAll(".vt").forEach(x=>x.classList.toggle("sel",x===btn));
      vb.innerHTML=VIEWS[btn.dataset.v];
    };
  });
  $("#btn-next").onclick=()=>{ $("#overlay").classList.remove("show"); startRound(); };
}

/* ---------- 自测模式 ---------- */
async function autoTest(){
  const log=[]; S.players=makePlayers(9,200);
  for(let g=0;g<3;g++){
    await startRound();
    $("#btn-go").click(); await sleep(200);
    for(let k=0;k<14;k++){
      if(S.phase!=="decision") break;
      if(!$("#btn-stop").disabled){ (Math.random()<0.5?$("#btn-draw"):$("#btn-stop")).click(); }
      await sleep(150);
    }
    await sleep(600);
    if($("#btn-next")) $("#btn-next").click();
    await sleep(200);
    log.push(`局${g+1} phase=${S.phase} me=${fmt(S.players[0].chips)}`);
  }
  const t=selfTest();
  const pass=t.filter(x=>x.ok).length;
  const bad=t.filter(x=>!x.ok).map(x=>x.name+"|got="+JSON.stringify(x.got)).join(";;");
  document.title=`TEST ${pass}/${t.length} cases, 3 rounds ok ### ${bad.slice(0,260)}`;
  window.__testDone={pass,total:t.length,log};
}
window.__selfTest=selfTest;

/* ---------- 启动 ---------- */
window.addEventListener("error",e=>{ window.__err=String(e.message||e); });
$("#specbtn").onclick=()=>$("#speclist").classList.toggle("show");
S.players=makePlayers(9,200); renderAll(); setBanner("点击「发牌」开始"); startRound();
if(new URLSearchParams(location.search).get("test")==="1") autoTest();
</script>
